[tool.poetry]
name = "featurehero"
version = "2026.1.1"
description = "Application desktop for Genetic Orchestrator for selection of variables and machine model"
authors = ["Juan Carlos Moreno Sanchez"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12.0"
pandas = "^2.3.3"
numpy = "^2.3.4"
pykrige = "^1.7.3"
numbers-parser = "^4.16.2"
scikit-learn = "^1.7.2"
xgboost = "^3.1.1"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"
psutil = "^7.1.3"
openpyxl = "^3.1.5"
Pillow = "^11.3.0"

[tool.poetry.scripts]
featurehero = "featurehero.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

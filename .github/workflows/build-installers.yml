name: Build Native Installers

# Required secrets:
# - APP_DOTENV_B64: base64 of the project .env file (recommended)
#   or APP_DOTENV: raw multi-line .env content

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/build-installers.yml'
      - 'installers/**'
      - 'resources/featurehero/**'
      - 'server.py'
      - 'config_env.py'
      - 'pipeline/**'
      - 'preprocess/**'
      - 'ce_pipeline/**'
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'selecctionProperties/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'workbook_preview.py'
      - 'package.json'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build-runtime:
    name: Build ${{ matrix.platform }} runtime
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            python-version: '3.12'
          - platform: windows
            runner: windows-latest
            python-version: '3.12'
          - platform: macos
            runner: macos-latest
            python-version: '3.12.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project .env from GitHub secret
        shell: bash
        env:
          APP_DOTENV_B64: ${{ secrets.APP_DOTENV_B64 }}
          APP_DOTENV: ${{ secrets.APP_DOTENV }}
        run: |
          set -euo pipefail
          if [ -n "${APP_DOTENV_B64:-}" ]; then
            printf '%s' "$APP_DOTENV_B64" | base64 --decode > .env
          elif [ -n "${APP_DOTENV:-}" ]; then
            printf '%s\n' "$APP_DOTENV" > .env
          else
            echo 'Missing GitHub secret APP_DOTENV_B64 or APP_DOTENV' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Stage bundled Python 3.12 runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="installers/runtimes/${{ matrix.platform }}/python-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          python_prefix=$(python3 -c "import sys; print(sys.prefix)")
          cp -R "$python_prefix"/. "$runtime_dir"

      - name: Download bundled Python 3.12 installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="installers/runtime-archives"
          mkdir -p "$archive_dir"
          curl -L --fail --retry 3 \
            https://www.python.org/ftp/python/3.12.13/python-3.12.13-macos11.pkg \
            -o "$archive_dir/python-3.12.pkg"

      - name: Stage bundled Python 3.12 runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $runtimeDir = "installers/runtimes/${{ matrix.platform }}/python-runtime"
          if (Test-Path $runtimeDir) { Remove-Item $runtimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $pythonPrefix = python -c "import sys; print(sys.prefix)"
          Copy-Item -Recurse -Force "$pythonPrefix\*" $runtimeDir

      - name: Stage runtime tree (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="installers/runtimes/${{ matrix.platform }}/python-installer"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          cp installers/runtime-archives/python-3.12.pkg "$runtime_dir/python-3.12.pkg"

      - name: Archive runtime tree (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="installers/runtime-archives"
          mkdir -p "$archive_dir"
          tar -C installers/runtimes/${{ matrix.platform }} -czf "$archive_dir/runtime-${{ matrix.platform }}.tar.gz" .

      - name: Archive runtime tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $archiveDir = "installers/runtime-archives"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          tar -C "installers/runtimes/${{ matrix.platform }}" -czf "$archiveDir/runtime-${{ matrix.platform }}.tar.gz" .

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: installers/runtime-archives/runtime-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  assemble-installers:
    name: Assemble native installer packages
    runs-on: ubuntu-latest
    needs: build-runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project .env from GitHub secret
        shell: bash
        env:
          APP_DOTENV_B64: ${{ secrets.APP_DOTENV_B64 }}
          APP_DOTENV: ${{ secrets.APP_DOTENV }}
        run: |
          set -euo pipefail
          if [ -n "${APP_DOTENV_B64:-}" ]; then
            printf '%s' "$APP_DOTENV_B64" | base64 --decode > .env
          elif [ -n "${APP_DOTENV:-}" ]; then
            printf '%s\n' "$APP_DOTENV" > .env
          else
            echo 'Missing GitHub secret APP_DOTENV_B64 or APP_DOTENV' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Linux runtime archive
        uses: actions/download-artifact@v4
        with:
          name: runtime-linux
          path: installers/runtime-archives/linux

      - name: Download Windows runtime archive
        uses: actions/download-artifact@v4
        with:
          name: runtime-windows
          path: installers/runtime-archives/windows

      - name: Download macOS runtime archive
        uses: actions/download-artifact@v4
        with:
          name: runtime-macos
          path: installers/runtime-archives/macos

      - name: Extract runtime archives
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux windows macos; do
            archive="installers/runtime-archives/${platform}/runtime-${platform}.tar.gz"
            target="installers/runtimes/${platform}"
            rm -rf "$target"
            mkdir -p "$target"
            tar -xzf "$archive" -C "$target"
          done

      - name: Build native installer archives
        shell: bash
        run: |
          set -euo pipefail
          python3 installers/build_native_runtime_packages.py

      - name: Upload native installer archives
        uses: actions/upload-artifact@v4
        with:
          name: native-installers
          path: dist/Mictlan-AgriXGBoost-installer-*-native.zip
          if-no-files-found: error

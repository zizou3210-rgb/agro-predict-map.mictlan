name: Build Native Installers

# Required secrets:
# - APP_DOTENV_B64: base64 of the project .env file (recommended)
#   or APP_DOTENV: raw multi-line .env content

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/build-installers.yml'
      - 'installers/**'
      - 'resources/featurehero/**'
      - 'server.py'
      - 'config_env.py'
      - 'pipeline/**'
      - 'preprocess/**'
      - 'ce_pipeline/**'
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'selecctionProperties/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'workbook_preview.py'
      - 'package.json'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build-runtime:
    name: Build ${{ matrix.platform }} runtime
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            python-version: '3.12'
          - platform: windows
            runner: windows-latest
            python-version: '3.12'
          - platform: macos
            runner: macos-latest
            python-version: '3.12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project .env from GitHub secret
        shell: bash
        env:
          APP_DOTENV_B64: ${{ secrets.APP_DOTENV_B64 }}
          APP_DOTENV: ${{ secrets.APP_DOTENV }}
        run: |
          set -euo pipefail
          if [ -n "${APP_DOTENV_B64:-}" ]; then
            printf '%s' "$APP_DOTENV_B64" | base64 --decode > .env
          elif [ -n "${APP_DOTENV:-}" ]; then
            printf '%s\n' "$APP_DOTENV" > .env
          else
            echo 'Missing GitHub secret APP_DOTENV_B64 or APP_DOTENV' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build FeatureHero venv (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd resources/featurehero
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install .

      - name: Build FeatureHero venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          Set-Location resources/featurehero
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install .

      - name: Stage runtime tree (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="installers/runtimes/${{ matrix.platform }}/resources/featurehero"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          cp -R resources/featurehero/.venv "$runtime_dir/.venv"

      - name: Stage runtime tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $runtimeDir = "installers/runtimes/${{ matrix.platform }}/resources/featurehero"
          if (Test-Path $runtimeDir) { Remove-Item $runtimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          Copy-Item -Recurse -Force resources/featurehero/.venv "$runtimeDir/.venv"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: installers/runtimes/${{ matrix.platform }}
          include-hidden-files: true
          if-no-files-found: error

  assemble-installers:
    name: Assemble native installer packages
    runs-on: ubuntu-latest
    needs: build-runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project .env from GitHub secret
        shell: bash
        env:
          APP_DOTENV_B64: ${{ secrets.APP_DOTENV_B64 }}
          APP_DOTENV: ${{ secrets.APP_DOTENV }}
        run: |
          set -euo pipefail
          if [ -n "${APP_DOTENV_B64:-}" ]; then
            printf '%s' "$APP_DOTENV_B64" | base64 --decode > .env
          elif [ -n "${APP_DOTENV:-}" ]; then
            printf '%s\n' "$APP_DOTENV" > .env
          else
            echo 'Missing GitHub secret APP_DOTENV_B64 or APP_DOTENV' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Linux runtime
        uses: actions/download-artifact@v4
        with:
          name: runtime-linux
          path: installers/runtimes/linux

      - name: Download Windows runtime
        uses: actions/download-artifact@v4
        with:
          name: runtime-windows
          path: installers/runtimes/windows

      - name: Download macOS runtime
        uses: actions/download-artifact@v4
        with:
          name: runtime-macos
          path: installers/runtimes/macos

      - name: Normalize downloaded runtime layout
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux windows macos; do
            if [ -d "installers/runtimes/${platform}/${platform}" ]; then
              tmp_dir="installers/runtimes/${platform}.__tmp__"
              rm -rf "$tmp_dir"
              mv "installers/runtimes/${platform}/${platform}" "$tmp_dir"
              rm -rf "installers/runtimes/${platform}"
              mv "$tmp_dir" "installers/runtimes/${platform}"
            fi
          done

      - name: Build native installer archives
        shell: bash
        run: |
          set -euo pipefail
          python3 installers/build_native_runtime_packages.py

      - name: Upload native installer archives
        uses: actions/upload-artifact@v4
        with:
          name: native-installers
          path: dist/Mictlan-AgriXGBoost-installer-*-native.zip
          if-no-files-found: error
